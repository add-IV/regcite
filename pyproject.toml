[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regcite"
version = "0.1.0"
description = "Retrieve and cite regulatory text on AI in medicine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dense = ["numpy>=2,<3", "sentence-transformers>=6,<7"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8", "ruff>=0.6", "numpy>=2,<3", "fastapi>=0.115,<1", "httpx>=0.27,<1"]

[project.scripts]
regcite = "regcite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
