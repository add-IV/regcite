[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regcite"
version = "0.1.0"
description = "Retrieve and cite regulatory text on AI in medicine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dense = ["numpy>=2,<3", "sentence-transformers>=6,<7", "torch>=2.15,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "numpy>=2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]

[tool.uv.sources]
# CPU-only torch on Linux (the Docker image); the PyPI wheel would pull in CUDA.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
regcite = "regcite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
